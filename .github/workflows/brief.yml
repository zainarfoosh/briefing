name: Daily biopharma brief

on:
  workflow_dispatch:
    inputs:
      list_folders:
        description: "List Gmail folders instead of building the brief"
        type: boolean
        default: false
  schedule:
    # 10:30 UTC — 6:30am EDT / 5:30am EST. GitHub's cron is UTC and does not
    # follow daylight saving, so this drifts an hour in winter.
    - cron: "30 10 * * *"

permissions:
  contents: write
  issues: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the brief
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FOLDER: ${{ vars.GMAIL_FOLDER }}
          # Defaults to cohere. Set the LLM_PROVIDER variable to "anthropic" or
          # "gemini" to switch; only that provider's key needs to exist.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_MODEL: ${{ vars.COHERE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        # The list_folders input is a one-off diagnostic: it prints every IMAP
        # folder so the Biopharma label's exact name is visible, without needing
        # the app password on a local machine. Empty on scheduled runs.
        run: |
          if [ "${{ inputs.list_folders }}" = "true" ]; then
            python fetch.py --list-folders
          else
            python run.py
          fi

      - name: Commit the brief
        run: |
          if ! git diff --quiet feed.json digest.md state.json; then
            git config user.name  "biopharma-brief"
            git config user.email "actions@github.com"
            git add feed.json digest.md state.json
            git commit -m "Brief for $(date -u +%Y-%m-%d)"
            git push
          fi

      # A silently broken morning is the main way this quietly dies.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Brief failed on $(date -u +%Y-%m-%d)" \
            --body "The daily run failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          cc @${{ github.repository_owner }}"
